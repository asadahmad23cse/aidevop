# HealthRAG AI - local stack (PRD section 25)
#   ollama  : local LLM runtime (persistent model storage)
#   app     : FastAPI backend + dashboard (one origin, port 8001)
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#   # one-time, pull the routed models into the ollama volume:
#   docker compose --profile setup run --rm model-puller
#   # open http://localhost:8001
services:
  ollama:
    image: ollama/ollama:latest
    container_name: healthrag-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: healthrag-app
    ports:
      - "${APP_PORT:-8001}:8001"
    environment:
      PORT: 8001
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-lexical}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${LLM_MODEL_MEDIUM:-gemma3:1b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      LLM_MODEL_EASY: ${LLM_MODEL_EASY:-qwen2.5:0.5b}
      LLM_MODEL_MEDIUM: ${LLM_MODEL_MEDIUM:-gemma3:1b}
      LLM_MODEL_COMPLEX: ${LLM_MODEL_COMPLEX:-smollm2:1.7b}
      RAG_INDEX_DIR: /app/outputs/rag_index
    volumes:
      # Persist uploaded knowledge (JSON/PDF) and the rebuilt index across restarts.
      - ./data/uploads:/app/data/uploads
      - rag_index:/app/outputs/rag_index
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # One-shot helper: pulls the three routed models into the ollama volume.
  # Run manually with:  docker compose --profile setup run --rm model-puller
  model-puller:
    image: curlimages/curl:latest
    profiles: ["setup"]
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for m in "${LLM_MODEL_EASY:-qwen2.5:0.5b}" "${LLM_MODEL_MEDIUM:-gemma3:1b}" "${LLM_MODEL_COMPLEX:-smollm2:1.7b}"; do
          echo "Pulling $$m ..." ;
          curl -s http://ollama:11434/api/pull -d "{\"name\":\"$$m\"}" -o /dev/null ;
        done ;
        echo "Done. Installed models:" ;
        curl -s http://ollama:11434/api/tags

volumes:
  ollama_models:
    name: healthrag_ollama_models
  rag_index:
    name: healthrag_rag_index
